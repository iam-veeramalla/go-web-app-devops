# CI/CD using GitHub Actions

name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'README.md'
      - 'go-web-app-chart/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # 1. BUILD AND TEST
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -o go-web-app

      - name: Test
        run: go test ./...


  # ==========================================================
  # 2. CODE QUALITY
  # ==========================================================
  code-quality:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2


  # ==========================================================
  # 3. BUILD AND PUSH DOCKER IMAGE
  # ==========================================================
  push:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}


  # ==========================================================
  # 4. UPDATE HELM IMAGE TAG
  # ==========================================================
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image tag in Helm chart
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go-web-app-chart/values.yaml

          git commit -m "Update image tag to ${{ github.run_id }}" || echo "No changes to commit"

          git push

