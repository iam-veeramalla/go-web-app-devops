# CI/CD using GitHub Actions
name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "k8s/**"
      - "README.md"
      - "helm/go-web-app-chart/**"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ==========================================================
  # 1. BUILD AND TEST
  # ==========================================================

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download Go dependencies
        run: |
          go mod download

      - name: Build Go application
        run: |
          go build -o go-web-app

      - name: Run Go tests
        run: |
          go test ./...


  # ==========================================================
  # 2. CODE QUALITY
  # ==========================================================

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download Go dependencies
        run: |
          go mod download

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.64.8

      - name: Add golangci-lint to PATH
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify golangci-lint
        run: |
          golangci-lint --version

      - name: Run golangci-lint
        run: |
          golangci-lint run ./...


  # ==========================================================
  # 3. BUILD AND PUSH DOCKER IMAGE
  # ==========================================================

  push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{ github.run_id }}
            ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:latest


  # ==========================================================
  # 4. UPDATE HELM IMAGE TAG
  # ==========================================================

  update-newtag-in-helm-chart:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest

    needs:
      - push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image tag in Helm chart
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-chart/values.yaml

      - name: Verify Helm values
        run: |
          echo "Updated Helm values:"
          grep -A3 '^image:' helm/go-web-app-chart/values.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Helm lint
        run: |
          helm lint ./helm/go-web-app-chart

      - name: Show Git diff
        run: |
          git diff -- helm/go-web-app-chart/values.yaml

      - name: Commit and push Helm changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/go-web-app-chart/values.yaml

          git commit -m "Update image tag to ${{ github.run_id }}" \
            || echo "No changes to commit"

          git push