apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-app-nginx
spec:
  ingressClassName: nginx
  rules:
    - host: go-web-app.local
      http:
        paths:
          - path: /courses
            pathType: Prefix
            backend:
              service:
                name: go-web-app
                port:
                  number: 80
